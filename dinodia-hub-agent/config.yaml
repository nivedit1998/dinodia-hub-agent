name: Dinodia Hub Agent
slug: dinodia-hub-agent
version: "0.4.2"
description: Local authenticated proxy/WS bridge to Home Assistant Core for Dinodia
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false

homeassistant_api: true
hassio_api: true

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Dinodia Hub Agent HTTP/WS endpoint

options:
  port: 8099

  hub_tokens: []
  hub_token_hashes: []

  ws_auth_mode: "supervisor"
  ha_access_token: ""

  allowed_path_regex:
    - "^/api/?$"
    - "^/api/states($|/.*)"
    - "^/api/services/.*"
    - "^/api/template$"
    - "^/api/config.*"
    - "^/api/camera_proxy/.*"
    - "^/api/websocket$"

  log_level: "info"

  # Platform sync (disabled until platform endpoint exists)
  platform_sync_enabled: false
  platform_base_url: "https://app.dinodiasmartliving.com"
  platform_token_state_endpoint: "/api/hub-agent/token-state"
  platform_sync_interval_minutes: 2
  sync_status_token: ""
  hub_agent_id: ""
  hub_agent_secret: ""

  heating_usage_tracking_enabled: true
  heating_usage_tracking_labels:
    - "Boiler"
    - "Radiator"
  heating_usage_persist_path: "/data/heating_usage_state.json"
  heating_usage_max_tracked_entities: 200
  heating_usage_min_process_interval_ms: 1000
  heating_usage_label_refresh_minutes: 30

schema:
  port: int(1,65535)

  hub_tokens:
    - str?
  hub_token_hashes:
    - str?

  ws_auth_mode: list(supervisor|ha|auto)
  ha_access_token: str?

  allowed_path_regex:
    - str?

  log_level: list(trace|debug|info|warn|error)

  platform_sync_enabled: bool
  platform_base_url: str?
  platform_token_state_endpoint: str?
  platform_sync_interval_minutes: int(2,1440)
  sync_status_token: str?
  hub_agent_id: str?
  hub_agent_secret: str?

  heating_usage_tracking_enabled: bool
  heating_usage_tracking_labels:
    - str?
  heating_usage_persist_path: str?
  heating_usage_max_tracked_entities: int(1,1000)
  heating_usage_min_process_interval_ms: int(0,60000)
  heating_usage_label_refresh_minutes: int(1,1440)
